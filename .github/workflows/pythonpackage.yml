# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MindMeld

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mm-extras: ["true", "false"]
        es_version: [7.17.28]

    steps:
    - uses: actions/checkout@v4

    - uses: elastic/elastic-github-actions/elasticsearch@master
      with:
        stack-version: ${{ matrix.es_version }}
        security-enabled: false
        wait: 10

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        #java-version: '9.0.4' # The JDK version to make available on the path.
        #java-package: jdk # (jre, jdk, or jdk+fx) - defaults to jdk
        architecture: x64 # (x64 or x86) - defaults to x64
      env:
        MM_EXTRAS: ${{ matrix.mm-extras }}

    - name: Install dependencies
      run: |
        ./scripts/py_dep_install.sh
      env:
        MM_EXTRAS: ${{ matrix.mm-extras }}

    - name: Linting
      run: |
        ./lintme

    - name: Running numerical parser
      run: |
        mindmeld num-parse

    - name: Sleep for 30 seconds
      uses: jakejarvis/wait-action@master
      with:
        time: '30s'

    - name: Test with pytest
      run: |
        mkdir ~/test-reports
        pytest --junitxml=~/test-reports/junit.xml --cov-report html --cov=mindmeld --ignore=examples/
      env:
        MM_EXTRAS: ${{ matrix.mm-extras }}
        MM_SUBPROCESS_COUNT: 0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: junitxml
        path: ~/test-reports/junit.xml
